[package]
name = "symbolicator"
version = "26.2.1"
authors = ["Sentry <hello@getsentry.com>"]
edition = "2024"
license-file = "../../LICENSE.md"
default-run = "symbolicator"

[features]
# FIPS 140-3: load OpenSSL FIPS provider at startup; use native-tls (OpenSSL) for outbound HTTPS. Build with: cargo build --no-default-features --features fips -p symbolicator
fips = ["dep:openssl", "symbolicator-service/fips"]

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
axum-server = { workspace = true }
clap = { workspace = true }
console = { workspace = true}
futures = { workspace = true}
hostname = { workspace = true}
humantime =  { workspace = true }
rustls = { workspace = true }
sentry = { workspace = true, features = ["release-health", "tower", "tower-http"] }
serde = { workspace = true }
serde_json = { workspace = true}
symbolic = { workspace = true }
symbolicator-crash = { workspace = true, optional = true }
symbolicator-js = { workspace = true }
symbolicator-native = { workspace = true }
symbolicator-proguard = { workspace = true }
symbolicator-sources = { workspace = true }
openssl = { workspace = true, optional = true }

[target.'cfg(not(feature = "fips"))'.dependencies]
symbolicator-service = { path = "../symbolicator-service", default-features = false, features = ["rustls"] }

[target.'cfg(feature = "fips")'.dependencies]
symbolicator-service = { path = "../symbolicator-service", default-features = false, features = ["fips"] }

[target.'cfg(not(feature = "fips"))'.dependencies]
reqwest = { workspace = true, default-features = false, features = ["rustls-tls", "multipart"] }

[target.'cfg(feature = "fips")'.dependencies]
reqwest = { workspace = true, default-features = false, features = ["native-tls", "multipart"] }

[dependencies]
tempfile = { workspace = true }
thiserror = { workspace = true}
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs"] }
tokio-metrics = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }
tower = { workspace = true}
tower-layer = { workspace = true}
tower-service = { workspace = true}
tracing = { workspace = true}
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
reqwest = { workspace = true, features = ["multipart"] }
symbolicator-test = { workspace = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
jemallocator = { workspace = true }
